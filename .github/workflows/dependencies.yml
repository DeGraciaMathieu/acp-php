name: Dependencies

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Download the analyzer
        run: wget -q https://github.com/DeGraciaMathieu/php-class-dependencies-analyzer/raw/1.1.0/builds/class-dependencies-analyzer

      - name: Analyze dependencies
        run: php class-dependencies-analyzer analyze --format=sarif --output=dependencies.sarif

      - name: Upload the SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: dependencies.sarif
          category: dependencies
