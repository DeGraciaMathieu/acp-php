<svg viewBox="0 0 360 190" width="360" height="190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="acp-php">
  <style>
    .ink { fill: #1f2328 }
    .track { stroke: #d0d7de }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3 }
      .track { stroke: #30363d }
    }
  </style>
  <rect x="20" y="30" width="80" height="80" rx="18" fill="#777bb4"/>
  <text x="60" y="80" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#fff">php</text>
  <circle cx="300" cy="70" r="40" fill="#d97757"/>
  <g stroke="#fff" stroke-width="5" stroke-linecap="round" transform="translate(300 70)">
    <line y1="-20" y2="20"/>
    <line x1="-20" x2="20"/>
    <line x1="-14" y1="-14" x2="14" y2="14"/>
    <line x1="-14" y1="14" x2="14" y2="-14"/>
    <animateTransform attributeName="transform" type="rotate" values="0;0;45;45" keyTimes="0;.4;.6;1" dur="3.2s" additive="sum" repeatCount="indefinite"/>
  </g>
  <line class="track" x1="112" y1="58" x2="252" y2="58" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <line class="track" x1="112" y1="82" x2="252" y2="82" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <!-- Requests travel to the agent, responses come back. -->
  <circle cy="58" r="5" fill="#777bb4">
    <animate attributeName="cx" from="112" to="252" dur="1.6s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="1.6s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cy="58" r="5" fill="#777bb4">
    <animate attributeName="cx" from="112" to="252" dur="1.6s" begin=".53s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="1.6s" begin=".53s" repeatCount="indefinite"/>
  </circle>
  <circle cy="58" r="5" fill="#777bb4">
    <animate attributeName="cx" from="112" to="252" dur="1.6s" begin="1.06s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="1.6s" begin="1.06s" repeatCount="indefinite"/>
  </circle>
  <circle cy="82" r="5" fill="#d97757">
    <animate attributeName="cx" from="252" to="112" dur="1.6s" begin=".27s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="1.6s" begin=".27s" repeatCount="indefinite"/>
  </circle>
  <circle cy="82" r="5" fill="#d97757">
    <animate attributeName="cx" from="252" to="112" dur="1.6s" begin=".8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="1.6s" begin=".8s" repeatCount="indefinite"/>
  </circle>
  <circle cy="82" r="5" fill="#d97757">
    <animate attributeName="cx" from="252" to="112" dur="1.6s" begin="1.33s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="1.6s" begin="1.33s" repeatCount="indefinite"/>
  </circle>
  <text class="ink" x="180" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="700">acp-php</text>
</svg>
